name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: setup
        run: python scripts/tasks.py setup
      - name: lint
        run: python scripts/tasks.py lint
      - name: test
        run: python scripts/tasks.py test
      - name: secret-scan
        run: python scripts/tasks.py secret-scan
      - name: hardcode-check
        run: python scripts/tasks.py hardcode-check
